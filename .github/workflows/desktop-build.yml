name: Desktop Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event.inputs.release_tag || github.ref }}

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            buildArgs: --mac --x64 --arm64
            artifact: fbabuddy-macos
            files: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
          - name: Windows
            os: windows-latest
            buildArgs: --win --x64
            artifact: fbabuddy-windows
            files: |
              release/*.exe
              release/latest.yml
              release/*.blockmap
          - name: Linux
            os: ubuntu-22.04
            buildArgs: --linux --x64
            artifact: fbabuddy-linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
              release/*.blockmap
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools
      - run: pnpm build
      - run: node scripts/pack.mjs ${{ matrix.buildArgs }} --publish never
      - name: List packages
        shell: bash
        run: find release -maxdepth 1 -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v.+ ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi
          mapfile -d '' files < <(find artifacts -type f -print0)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FbaBuddy $RELEASE_TAG" \
              --generate-notes
          fi
